<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peltier Development — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0A0E14; --surface:#12161F; --surface-2:#1A2030; --text:#E8ECF1; --muted:#8A94A6;
  --heat:#E31C3D; --heat-dim:#7A1522; --cold:#1C7DE0; --cold-dim:#123457; --border:#232A3A;
  box-sizing:border-box;
  color-scheme: dark;
}
* { box-sizing:inherit; }
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;}
.mono{font-family:"IBM Plex Mono",monospace;}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;line-height:1.15;margin:0 0 .5rem;}
p{color:var(--muted);}
a{color:var(--text);}
.site-nav{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.5rem;}
.brand{font-family:"Space Grotesk",sans-serif;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:.5rem;color:var(--text);background:none;border:none;cursor:pointer;font-size:1rem;padding:0;}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:linear-gradient(180deg,var(--heat),var(--cold));font-weight:700;font-size:.95rem;color:#fff;}
.site-nav nav{display:flex;gap:1.25rem;align-items:center;font-size:.95rem;}
.site-nav nav a{text-decoration:none;color:var(--muted);cursor:pointer;background:none;border:none;font-size:.95rem;font-family:inherit;}
.nav-cta{background:var(--surface-2);color:var(--text)!important;padding:.45rem .9rem;border-radius:8px;border:1px solid var(--border);}
main{max-width:720px;margin:0 auto;padding:0 1.5rem 4rem;}
.hero{position:relative;margin:0 -1.5rem 2.5rem;padding:4rem 1.5rem 5rem;overflow:hidden;text-align:center;}
.hero-heat,.hero-cold{position:absolute;left:0;right:0;z-index:0;}
.hero-heat{top:0;height:55%;background:linear-gradient(180deg,var(--heat) 0%,var(--heat-dim) 100%);}
.hero-cold{bottom:0;height:55%;background:linear-gradient(0deg,var(--cold) 0%,var(--cold-dim) 100%);}
.hero-mark{position:relative;z-index:1;margin:0 auto 1.5rem;width:96px;height:96px;border-radius:20px;background:var(--ink);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:2.5rem;box-shadow:0 10px 40px rgba(0,0,0,.4);color:#fff;}
.hero-copy{position:relative;z-index:1;}
.hero h1{font-size:2.1rem;color:#fff;}
.hero-sub{color:rgba(255,255,255,.85);max-width:480px;margin:0 auto 1.5rem;}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-bottom:2rem;}
.strip-item h3{font-size:1rem;}
.strip-item p{font-size:.9rem;}
@media (max-width:640px){.strip{grid-template-columns:1fr;}}
.btn{display:inline-block;padding:.75rem 1.4rem;border-radius:8px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:.95rem;font-family:"IBM Plex Sans",sans-serif;}
.btn-primary{background:var(--text);color:var(--ink);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn.full{display:block;width:100%;text-align:center;}
.btn.small{padding:.4rem .8rem;font-size:.85rem;}
.story p{color:var(--text);max-width:640px;}
.funnel-step{padding-top:2.5rem;}
.lede{max-width:520px;}
.choice-row{display:grid;gap:1rem;margin-top:1.5rem;}
.choice-card{display:block;padding:1.25rem;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--text);cursor:pointer;width:100%;text-align:left;font-family:inherit;}
.choice-card h2{font-size:1.15rem;}
.choice-card p{font-size:.9rem;margin:0;}
.field{display:block;margin-bottom:1.1rem;}
.field-label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.35rem;}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;padding:.7rem .8rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:1rem;}
textarea{resize:vertical;}
.chip-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.chip-radio{display:flex;align-items:center;gap:.4rem;padding:.5rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.9rem;cursor:pointer;}
.agree-row{width:100%;align-items:flex-start;margin:1rem 0;font-size:.85rem;color:var(--muted);}
.agree-row input{margin-top:.2rem;}
.agree-row a{color:var(--cold);}
.hint{font-size:.9rem;margin-top:.5rem;}
.hint-error{color:var(--heat);}
.hint-good{color:#34C77B;}
.result-card{border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-top:1rem;background:var(--surface);}
.result-good{border-color:#34C77B;}
.ref-code{font-size:1.3rem;letter-spacing:.05em;}
.video-frame{aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin:1.25rem 0;border:1px solid var(--border);}
.wait-state{display:flex;align-items:center;gap:.5rem;margin-top:1.25rem;color:var(--muted);font-size:.9rem;}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--cold);animation:pulse 1.4s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
.admin-header{display:flex;justify-content:space-between;align-items:baseline;margin-top:2rem;flex-wrap:wrap;gap:.5rem;}
.admin-tabs{display:flex;gap:1.25rem;border-bottom:1px solid var(--border);padding-bottom:.75rem;margin-bottom:1.5rem;font-size:.9rem;flex-wrap:wrap;}
.admin-tabs a{text-decoration:none;color:var(--muted);cursor:pointer;}
.admin-tabs a.active{color:var(--text);font-weight:600;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center;}
.stat-num{display:block;font-family:"Space Grotesk",sans-serif;font-size:1.6rem;font-weight:700;}
.stat-label{font-size:.8rem;color:var(--muted);}
.table{width:100%;border-collapse:collapse;font-size:.9rem;}
.table th,.table td{text-align:left;padding:.6rem .4rem;border-bottom:1px solid var(--border);}
.badge{padding:.2rem .55rem;border-radius:999px;font-size:.78rem;border:1px solid var(--border);}
.badge-awaiting_payment{color:var(--muted);}
.badge-paid{color:var(--cold);border-color:var(--cold);}
.badge-confirmed{color:#E8B93F;border-color:#E8B93F;}
.badge-shipped{color:#34C77B;border-color:#34C77B;}
.empty-state{padding:1.5rem;text-align:center;border:1px dashed var(--border);border-radius:10px;}
.product-form{display:grid;grid-template-columns:140px 1fr;gap:1.25rem;margin-bottom:2rem;}
.photo-drop{display:flex;align-items:center;justify-content:center;height:140px;border:1px dashed var(--border);border-radius:10px;font-size:.85rem;color:var(--muted);text-align:center;cursor:pointer;overflow:hidden;}
.photo-drop img{width:100%;height:100%;object-fit:cover;}
@media (max-width:560px){.product-form{grid-template-columns:1fr;}}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.5rem;}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem;}
.product-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:.5rem;}
.product-card h3{font-size:.95rem;}
.product-card p{font-size:.85rem;margin:0 0 .3rem;}
.product-inactive{opacity:.5;}
@media (max-width:560px){.product-grid{grid-template-columns:1fr 1fr;}}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem;}
.order-head{display:flex;justify-content:space-between;margin-bottom:.4rem;}
.tracking-form{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;}
.tracking-form input{width:auto;flex:1;min-width:140px;}
.checkout-row{display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--border);}
.qty-input{width:70px;}
.order-items{padding-left:1.1rem;font-size:.9rem;}
.flash-stack{max-width:720px;margin:1rem auto 0;padding:0 1.5rem;}
.flash{background:var(--heat-dim);border:1px solid var(--heat);padding:.7rem 1rem;border-radius:8px;margin-bottom:.6rem;font-size:.9rem;}
.site-footer{text-align:center;color:var(--muted);font-size:.8rem;padding:2rem 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem;}
.footer-links a{color:var(--muted);cursor:pointer;}
.legal h2{font-size:1.05rem;margin-top:1.75rem;}
.legal ul{color:var(--muted);padding-left:1.2rem;}
.legal li{margin-bottom:.5rem;}
.muted{color:var(--muted);}
.demo-banner{background:var(--surface-2);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;text-align:center;font-size:.8rem;color:var(--muted);}
button{font-family:inherit;}
</style>
</head>
<body>
<div class="demo-banner">Clickable demo — front-end only. No real e-Transfer/email watching here; "payment" is simulated with a button.</div>
<header class="site-nav">
  <button class="brand" onclick="nav('home')"><span class="brand-mark">P</span> Peltier Development</button>
  <nav>
    <a onclick="nav('home')">Home</a>
    <a onclick="nav('story')">Our Story</a>
    <a onclick="nav('create')" class="nav-cta">Create</a>
  </nav>
</header>
<div id="flash" class="flash-stack"></div>
<main id="app"></main>
<footer class="site-footer">
  <span>&copy; 2026 Peltier Development · Prince Edward Island</span>
  <span class="footer-links"><a onclick="nav('terms')">Terms of Service</a> · <a onclick="nav('privacy')">Privacy Policy</a></span>
</footer>

<script>
// ---------- tiny state store (localStorage-backed, per-artifact only) ----------
const DB_KEY = 'peltdev_demo_v1';
function loadDb(){
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || {stores:{}, orders:[], nextOrderId:1}; }
  catch(e){ return {stores:{}, orders:[], nextOrderId:1}; }
}
function saveDb(db){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
let db = loadDb();
let session = { draftSubdomain:null, storeId:null, viewingSubdomain:null };
let route = 'home';

function money(cents){ return '$' + (cents/100).toFixed(2); }
function flash(msg){
  const el = document.getElementById('flash');
  el.innerHTML = '<div class="flash">'+msg+'</div>';
  setTimeout(()=>{ el.innerHTML=''; }, 4000);
}
function nav(r, arg){ route = r; render(arg); window.scrollTo(0,0); }

// ---------- render ----------
function render(arg){
  const app = document.getElementById('app');
  app.innerHTML = views[route] ? views[route](arg) : views.home();
  bindActive();
}
function bindActive(){
  document.querySelectorAll('.admin-tabs a').forEach(a=>a.classList.remove('active'));
  const activeMap = {admin:'ov', products:'pr', orders:'or', settings:'se'};
}

const views = {
  home: () => `
    <section class="hero">
      <div class="hero-heat"></div><div class="hero-cold"></div>
      <div class="hero-mark">P</div>
      <div class="hero-copy">
        <h1>Sell online. Keep the fee out of it.</h1>
        <p class="hero-sub">A store under your own <span class="mono">yourname.pelt.dev</span> address. No card processor cut, no monthly platform tax — payment moves owner to owner by e-Transfer.</p>
        <button class="btn btn-primary" onclick="nav('create')">Start building</button>
      </div>
    </section>
    <section class="strip">
      <div class="strip-item"><h3>One flat fee</h3><p>$25 CAD to set up your store. That's it — no percentage taken off every sale after.</p></div>
      <div class="strip-item"><h3>Your own address</h3><p>Pick a name, get <span class="mono">yourname.pelt.dev</span>, and send customers straight there.</p></div>
      <div class="strip-item"><h3>You run it</h3><p>Add products, watch orders come in, mark them shipped — from one admin page.</p></div>
    </section>`,

  story: () => `
    <section class="story"><h1>Why this exists</h1>
      <p>I'm a developer from Prince Edward Island, and this started in a rural Charlottetown-area high school, in an entrepreneurship class that asked us to build a business plan from nothing.</p>
      <p>I'd already been building and selling things for a while by then, and every platform I touched wanted a cut. A percentage here, a monthly fee there, a payment processor skimming off the top of money I'd already earned. When the assignment asked what problem I'd solve, I didn't have to think hard — I was already living it.</p>
      <p>So I built the thing I actually wanted: a way to put a store online without handing a slice of every sale to someone who did none of the work. No card processor in the middle. No subscription creeping up every year. Just your storefront, your customers, and the money going straight to you.</p>
      <p>Peltier Development is that idea, built out properly. Pick a name, get a store, sell what you make.</p>
      <button class="btn btn-primary" onclick="nav('create')">See how it works</button>
    </section>`,

  terms: () => `<section class="story legal"><h1>Terms of Service</h1>
    <p class="muted">Last updated 2026. General template — not legal advice.</p>
    <h2>1. What Peltier Development is</h2><p>A software provider. Not a party to any sale, doesn't hold buyer funds, doesn't guarantee listings.</p>
    <h2>2. Seller terms</h2><ul><li>You own accuracy, legality, fulfillment, and taxes on what you sell.</li><li>$25 CAD setup fee is non-refundable once your subdomain is provisioned.</li><li>Buyer payments move directly to you by e-Transfer — we never touch that money.</li><li>Automated payment matching can miss or delay — verify your bank before shipping anything valuable.</li></ul>
    <h2>3. Buyer terms</h2><ul><li>Your contract is with the seller, not us.</li><li>Refunds/disputes are between you and the seller.</li></ul>
    <h2>4–9</h2><p class="muted">Acceptable use, no warranty, liability capped at fees paid to us, termination, PEI/Canada governing law, and terms may change — see the full version in the downloaded app.</p></section>`,

  privacy: () => `<section class="story legal"><h1>Privacy Policy</h1>
    <p class="muted">Last updated 2026. General template — not legal advice.</p>
    <h2>What we collect</h2><ul><li>Sellers: email, hashed password, subdomain, business name, shipping flag.</li><li>Inbox watcher: an app password, encrypted at rest, never shown back to anyone.</li><li>Buyers: name, email, shipping address if physical.</li></ul>
    <h2>How it's used</h2><p>To run your store, match e-Transfer notifications, and let sellers fulfill orders. Never sold, never used for ads.</p></section>`,

  create: () => `
    <section class="funnel-step"><h1>What are you selling?</h1>
      <p class="lede">This decides how we set you up.</p>
      <div class="choice-row">
        <button class="choice-card" onclick="nav('createGood')"><h2>A good</h2><p>A physical product or a made thing — you get a storefront under your own pelt.dev name.</p></button>
        <button class="choice-card" onclick="nav('createService')"><h2>A service</h2><p>Custom work built to spec. Heads up — service builds run well above the $25 storefront setup.</p></button>
      </div>
    </section>`,

  createService: () => `
    <section class="funnel-step"><h1>Tell me what you need built.</h1>
      <p class="lede">Custom service work is quoted individually. Describe it and leave an email.</p>
      <form onsubmit="submitService(event)">
        <label class="field"><span class="field-label">What are you planning to build?</span><textarea rows="5" required id="svcDesc" placeholder="e.g. a custom trip planner with a booking calendar"></textarea></label>
        <label class="field"><span class="field-label">Your email</span><input type="email" id="svcEmail" required></label>
        <button class="btn btn-primary full" type="submit">Send it over</button>
      </form>
    </section>`,

  createGood: () => `
    <section class="funnel-step"><h1>What do you want your store called?</h1>
      <p class="lede">Letters only. Try <span class="mono">chaseslawnwork</span> for <span class="mono">chaseslawnwork.peltdev.com</span>.</p>
      <form onsubmit="checkSubdomain(event)">
        <div class="field"><span class="field-label">Store name</span>
        <input type="text" id="domainInput" pattern="[a-zA-Z]+" placeholder="chaseslawnwork" required></div>
        <button class="btn btn-primary full" type="submit">Check availability</button>
      </form>
      <div id="domainResult"></div>
    </section>`,

  createPreview: () => `
    <section class="funnel-step"><h1>Here's what you're getting.</h1>
      <p class="lede">A quick walkthrough before you commit to <span class="mono">${session.draftSubdomain}.peltdev.com</span>.</p>
      <div class="video-frame"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="walkthrough" frameborder="0" allowfullscreen></iframe></div>
      <button class="btn btn-primary full" onclick="nav('createSignup')">Looks good — set up my account</button>
    </section>`,

  createSignup: () => `
    <section class="funnel-step"><h1>Set up your account.</h1>
      <p class="lede">This is the login for <span class="mono">${session.draftSubdomain}.peltdev.com</span>'s admin panel.</p>
      <form onsubmit="submitSignup(event)">
        <label class="field"><span class="field-label">Business name</span><input type="text" id="bizName" placeholder="${session.draftSubdomain}"></label>
        <label class="field"><span class="field-label">Email</span><input type="email" id="ownerEmail" required></label>
        <label class="field"><span class="field-label">Password</span><input type="password" id="ownerPass" minlength="4" required></label>
        <fieldset class="field"><span class="field-label">Ships physical items, or in-person delivery?</span>
          <div class="chip-row">
            <label class="chip-radio"><input type="radio" name="phys" value="yes" required> Ships / needs address</label>
            <label class="chip-radio"><input type="radio" name="phys" value="no"> No shipping</label>
          </div>
        </fieldset>
        <label class="chip-radio agree-row"><input type="checkbox" id="agree1" required> I agree to the <a onclick="nav('terms')">Seller Terms</a> and <a onclick="nav('privacy')">Privacy Policy</a>.</label>
        <button class="btn btn-primary full" type="submit">Continue to payment</button>
      </form>
    </section>`,

  pay: () => {
    const store = db.stores[session.storeId];
    return `<section class="funnel-step"><h1>One last step — the setup fee.</h1>
      <p class="lede">Send an Interac e-Transfer for <strong>$25.00 CAD</strong> to <span class="mono">you@peltierdevelopment.com</span>.</p>
      <div class="result-card"><p><strong>Message field:</strong></p><p class="mono ref-code">${store.paymentRef}</p></div>
      <div class="wait-state"><span class="pulse-dot"></span> Waiting for payment…</div>
      <p class="hint">(Demo stand-in for the real email watcher)</p>
      <button class="btn btn-ghost full" onclick="simulatePayment()">Simulate payment received</button>
    </section>`;
  },

  admin: () => renderAdmin('overview'),
  products: () => renderAdmin('products'),
  orders: () => renderAdmin('orders'),

  storeFront: (sub) => {
    session.viewingSubdomain = sub || session.viewingSubdomain;
    const store = db.stores[session.viewingSubdomain];
    if(!store) return `<section class="funnel-step"><p class="empty-state">No such store.</p></section>`;
    const products = store.products.filter(p=>p.active);
    return `<section class="funnel-step"><h1>${store.businessName}</h1><p class="mono muted">${store.subdomain}.peltdev.com</p>
      ${products.length ? `<div class="product-grid">${products.map(p=>`
        <div class="product-card">${p.image?`<img src="${p.image}">`:''}<h3>${p.name}</h3><p class="mono">${money(p.price)}</p><p class="muted">${p.desc||''}</p></div>
      `).join('')}</div><button class="btn btn-primary full" onclick="nav('checkout','${store.subdomain}')">Order</button>`
      : `<p class="empty-state">Nothing listed yet.</p>`}
    </section>`;
  },

  checkout: (sub) => {
    const store = db.stores[sub || session.viewingSubdomain];
    const products = store.products.filter(p=>p.active);
    return `<section class="funnel-step"><h1>Your order</h1>
      <form onsubmit="placeOrder(event,'${store.subdomain}')">
        ${products.map(p=>`<div class="checkout-row"><div><strong>${p.name}</strong><p class="mono muted">${money(p.price)}</p></div><input type="number" min="0" value="0" class="qty-input" data-pid="${p.id}"></div>`).join('')}
        <label class="field"><span class="field-label">Your name</span><input type="text" id="custName"></label>
        <label class="field"><span class="field-label">Your email</span><input type="email" id="custEmail" required></label>
        ${store.isPhysical ? `<label class="field"><span class="field-label">Shipping address</span><textarea id="shipAddr" rows="3" required></textarea></label>` : ''}
        <label class="chip-radio agree-row"><input type="checkbox" id="agree2" required> I agree to the <a onclick="nav('terms')">Buyer Terms</a>. ${store.businessName} is an independent seller, not Peltier Development.</label>
        <button class="btn btn-primary full" type="submit">Place order</button>
      </form>
    </section>`;
  },

  orderStatus: (orderId) => {
    const order = db.orders.find(o=>o.id===orderId);
    const store = db.stores[order.storeSub];
    return `<section class="funnel-step"><h1>Order placed.</h1>
      ${!order.paid ? `<div class="result-card"><p>Send an Interac e-Transfer for <strong>${money(order.total)} CAD</strong> to ${store.businessName}.</p><p><strong>Message field:</strong></p><p class="mono ref-code">${order.paymentRef}</p></div>
      <div class="wait-state"><span class="pulse-dot"></span> Waiting for payment…</div>
      <button class="btn btn-ghost full" onclick="simulateOrderPayment('${order.id}')">Simulate payment received</button>` : ''}
      <h2>Items</h2><ul class="order-items">${order.items.map(i=>`<li>${i.qty} × ${i.name} — ${money(i.price*i.qty)}</li>`).join('')}</ul>
      <p>Status: <span class="badge badge-${order.paid?order.status:'awaiting_payment'}">${order.paid?order.status:'awaiting_payment'}</span></p>
      ${order.tracking ? `<p>Tracking: ${order.trackingCarrier||''} ${order.tracking}</p>` : ''}
    </section>`;
  },
};

function renderAdmin(tab){
  const store = db.stores[session.storeId];
  if(!store) return `<section class="funnel-step"><p class="empty-state">Not logged in. <button class="btn btn-ghost small" onclick="nav('create')">Create a store</button></p></section>`;
  const tabs = `<nav class="admin-tabs">
    <a class="${tab==='overview'?'active':''}" onclick="nav('admin')">Overview</a>
    <a class="${tab==='products'?'active':''}" onclick="nav('products')">Products</a>
    <a class="${tab==='orders'?'active':''}" onclick="nav('orders')">Orders</a>
    <a onclick="logout()">Log out</a>
  </nav>`;
  const header = `<div class="admin-header"><h1>${store.businessName}</h1><a class="mono" onclick="nav('storeFront','${store.subdomain}')">${store.subdomain}.peltdev.com ↗</a></div>`;

  if(tab==='overview'){
    const revenue = db.orders.filter(o=>o.storeSub===store.subdomain && o.paid).reduce((s,o)=>s+o.total,0);
    const pending = db.orders.filter(o=>o.storeSub===store.subdomain && o.paid && o.status==='paid').length;
    const recent = db.orders.filter(o=>o.storeSub===store.subdomain).slice(-5).reverse();
    return header+tabs+`<div class="stat-row">
      <div class="stat-card"><span class="stat-num">${store.products.length}</span><span class="stat-label">Products listed</span></div>
      <div class="stat-card"><span class="stat-num">${pending}</span><span class="stat-label">Orders to confirm</span></div>
      <div class="stat-card"><span class="stat-num">${money(revenue)}</span><span class="stat-label">Paid revenue</span></div>
    </div><h2>Recent orders</h2>
    ${recent.length ? `<table class="table"><thead><tr><th>Ref</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${recent.map(o=>`<tr><td class="mono">${o.paymentRef}</td><td>${o.customerName||o.customerEmail}</td><td>${money(o.total)}</td><td><span class="badge badge-${o.status}">${o.status}</span></td></tr>`).join('')}
    </tbody></table>` : `<p class="empty-state">No orders yet.</p>`}`;
  }
  if(tab==='products'){
    return header+tabs+`
      <form onsubmit="addProduct(event)" class="product-form">
        <label class="photo-drop" id="photoDrop"><span>Add a photo</span><input type="file" id="prodImg" accept="image/*" style="display:none" onchange="previewPhoto(this)"></label>
        <div>
          <label class="field"><span class="field-label">Name</span><input type="text" id="prodName" required></label>
          <label class="field"><span class="field-label">Description</span><textarea id="prodDesc" rows="2"></textarea></label>
          <label class="field"><span class="field-label">Price (CAD)</span><input type="number" id="prodPrice" min="0.01" step="0.01" required></label>
          <button class="btn btn-primary full" type="submit">Add listing</button>
        </div>
      </form>
      <h2>Live listings</h2>
      ${store.products.length ? `<div class="product-grid">${store.products.map(p=>`
        <div class="product-card ${p.active?'':'product-inactive'}">${p.image?`<img src="${p.image}">`:''}<h3>${p.name}</h3><p class="mono">${money(p.price)}</p><p class="muted">${p.desc||''}</p>
        <button class="btn btn-ghost small" onclick="toggleProduct(${p.id})">${p.active?'Hide':'Unhide'}</button></div>
      `).join('')}</div>` : `<p class="empty-state">Nothing listed yet.</p>`}`;
  }
  if(tab==='orders'){
    const orders = db.orders.filter(o=>o.storeSub===store.subdomain).reverse();
    return header+tabs+(orders.length ? orders.map(o=>`
      <div class="order-card"><div class="order-head"><span class="mono">${o.paymentRef}</span><span class="badge badge-${o.paid?o.status:'awaiting_payment'}">${o.paid?o.status:'unpaid'}</span></div>
      <p>${o.customerName||'No name'} · ${o.customerEmail}</p><p class="mono">${money(o.total)}</p>
      ${o.needsShipping ? `<p class="muted">Ships to: ${o.shippingAddress}</p>` : ''}
      ${o.tracking ? `<p class="muted">Tracking: ${o.trackingCarrier||''} ${o.tracking}</p>` : ''}
      ${!o.paid ? `<p class="hint">Waiting on e-Transfer.</p>` :
        o.status==='paid' ? `<button class="btn btn-primary" onclick="confirmOrder('${o.id}')">Confirm order</button>` :
        o.status==='confirmed' ? `<div class="tracking-form"><input type="text" id="carrier_${o.id}" placeholder="Carrier"><input type="text" id="track_${o.id}" placeholder="Tracking #"><button class="btn btn-primary" onclick="shipOrder('${o.id}')">Mark shipped</button></div>` :
        `<p class="hint hint-good">Shipped.</p>`}
      </div>`).join('') : `<p class="empty-state">No orders yet.</p>`);
  }
}

// ---------- actions ----------
function submitService(e){ e.preventDefault(); flash('Got it — that would be emailed over in the real app.'); nav('home'); }

function checkSubdomain(e){
  e.preventDefault();
  const raw = document.getElementById('domainInput').value.toLowerCase().replace(/[^a-z]/g,'');
  const el = document.getElementById('domainResult');
  if(!raw){ el.innerHTML = '<p class="hint hint-error">Letters only, please.</p>'; return; }
  if(db.stores[raw]){
    el.innerHTML = `<p class="hint hint-error"><span class="mono">${raw}.peltdev.com</span> is taken — try another.</p>`;
  } else {
    session.draftSubdomain = raw;
    el.innerHTML = `<div class="result-card result-good"><p>Available — <span class="mono">${raw}.peltdev.com</span></p><button class="btn btn-primary" onclick="nav('createPreview')">Use this name</button></div>`;
  }
}

function submitSignup(e){
  e.preventDefault();
  const phys = document.querySelector('input[name=phys]:checked');
  if(!document.getElementById('agree1').checked){ flash('You need to agree to the Seller Terms.'); return; }
  const sub = session.draftSubdomain;
  const ref = 'PELT-' + Math.random().toString(36).slice(2,8).toUpperCase();
  db.stores[sub] = {
    subdomain: sub,
    businessName: document.getElementById('bizName').value || sub,
    ownerEmail: document.getElementById('ownerEmail').value,
    isPhysical: phys.value==='yes',
    paymentRef: ref, setupPaid: false, products: [],
  };
  saveDb(db);
  session.storeId = sub;
  nav('pay');
}

function simulatePayment(){
  db.stores[session.storeId].setupPaid = true;
  saveDb(db);
  flash('Payment matched — welcome in.');
  nav('admin');
}

function logout(){ session.storeId = null; nav('home'); }

let pendingImage = null;
function previewPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => { pendingImage = reader.result; document.getElementById('photoDrop').innerHTML = `<img src="${pendingImage}">`; };
  reader.readAsDataURL(file);
}
function addProduct(e){
  e.preventDefault();
  const store = db.stores[session.storeId];
  const price = Math.round(parseFloat(document.getElementById('prodPrice').value)*100);
  if(!price || price<=0) return flash('Give it a price above $0.');
  store.products.push({ id: Date.now(), name: document.getElementById('prodName').value, desc: document.getElementById('prodDesc').value, price, image: pendingImage, active: true });
  pendingImage = null;
  saveDb(db);
  nav('products');
}
function toggleProduct(id){
  const store = db.stores[session.storeId];
  const p = store.products.find(p=>p.id===id);
  p.active = !p.active;
  saveDb(db);
  nav('products');
}

function placeOrder(e, sub){
  e.preventDefault();
  const store = db.stores[sub];
  if(!document.getElementById('agree2').checked){ flash('You need to agree to the Buyer Terms.'); return; }
  const items = [];
  let total = 0;
  document.querySelectorAll('[data-pid]').forEach(inp=>{
    const q = parseInt(inp.value)||0;
    if(q>0){ const p = store.products.find(p=>p.id==inp.dataset.pid); items.push({name:p.name, qty:q, price:p.price}); total += p.price*q; }
  });
  if(!items.length) return flash('Add at least one item.');
  if(store.isPhysical && !document.getElementById('shipAddr').value) return flash('Shipping address required.');
  const id = 'ord'+(db.nextOrderId++);
  const order = {
    id, storeSub: sub, customerName: document.getElementById('custName').value,
    customerEmail: document.getElementById('custEmail').value,
    shippingAddress: store.isPhysical ? document.getElementById('shipAddr').value : null,
    needsShipping: store.isPhysical, items, total,
    paymentRef: 'ORD-' + Math.random().toString(36).slice(2,8).toUpperCase(),
    paid: false, status: 'awaiting_payment', tracking:null, trackingCarrier:null,
  };
  db.orders.push(order);
  saveDb(db);
  nav('orderStatus', id);
}
function simulateOrderPayment(id){
  const order = db.orders.find(o=>o.id===id);
  order.paid = true; order.status = 'paid';
  saveDb(db);
  nav('orderStatus', id);
}
function confirmOrder(id){
  const order = db.orders.find(o=>o.id===id);
  order.status = 'confirmed';
  saveDb(db);
  nav('orders');
}
function shipOrder(id){
  const order = db.orders.find(o=>o.id===id);
  order.tracking = document.getElementById('track_'+id).value;
  order.trackingCarrier = document.getElementById('carrier_'+id).value;
  order.status = 'shipped';
  saveDb(db);
  nav('orders');
}

nav('home');
</script>
</body>
</html>
